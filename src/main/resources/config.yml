# CameraTrack 配置文件

# 语言: zh_cn / en_us / auto（auto = 跟随玩家客户端语言，找不到时回退 zh_cn）
# 翻译文件位于 plugins/CameraTrack/lang/<locale>.json（MiniMessage 格式）
language: zh_cn

# 默认播放模式:
#   entity   - 生成不可见的镜头实体，玩家旁观它，客户端对实体移动做插值（推荐，最平滑）
#   teleport - 逐 tick 直接传送玩家（旧模式，作为兼容/对照）
# 单次播放可用 /camera play <名称> --tp 或 --entity 临时覆盖。
playback-mode: entity

path:
  # 自动路径模式的“同平面”判定容差（格）。
  # 相邻两个节点在 X / Y / Z 任意一个轴上的差值不超过该值时，认为这一段位于同一平面，
  # 改用直线插值（只有朝向变化），而不是让样条把镜头鼓出平面。
  # 设为 0 表示只接受坐标完全相同（仍保留 1e-6 的浮点容差）。
  # 如果你做的是等高环绕镜头（所有节点同高、绕圈），把相应节点的 path 设为 curve。
  axis-tolerance: 0.05

  # 沿视线的弧线：只有两个节点的轨道（非共面）样条会退化成一条直线；
  # 开启后自动补一段单侧弧线——在连线中点朝“视线反方向”鼓出，形成完整的一段弧。
  # 单段也可以把节点 path 设为 arc 强制启用（同平面段同样生效）。
  # 多点轨道不需要它：邻居切线样条本身就会形成连续曲线。
  auto-arc: true

  # 弧线强度：弧顶偏移 = 段长 × 该值。0 = 不弯，建议 0.1 - 0.3（最大 0.5）。
  arc-strength: 0.15

# 轨迹粒子预览（/camera preview 与手持摄像工具左键共用）
preview:
  # 轨迹线：带颜色粒子（DUST），颜色用 #RRGGBB
  trail:
    color: "#00FF00"   # 亮绿色
    size: 1.0          # 粒子大小
    spacing: 0.15      # 相邻粒子的间距（格），越小越密
    max-points: 1200   # 单条轨迹最多画多少个点（长轨道会按比例抽稀）
  # 节点标记：更大的红色粒子，用来标出每个镜头的确切位置
  node:
    color: "#FF0000"   # 红色
    size: 2.0          # 比轨迹粒子更大
    count: 12          # 每个节点发射的粒子数
    spread: 0.06       # 节点粒子的散布半径（格）
  # 整条预览的持续时间（tick，20 tick = 1 秒）；0 表示只发射一次
  duration-ticks: 200
  # 重新发射间隔（tick）。粒子在客户端只能存活约 1 秒，
  # 因此会在持续时间内按这个间隔重复发射，让轨迹保持可见。
  refresh-ticks: 10
